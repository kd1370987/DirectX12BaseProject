<text x="-270.0" y="1275.0" fill="#bbb" font-size="16" font-family="sans-serif">入力は必ず InputManager 経由。アプリ側の割り当ては UserData に入り、</text>
<text x="-270.0" y="1295.8" fill="#bbb" font-size="16" font-family="sans-serif">InputActionManager が InputManager へ流し込む。</text>
<text x="-270.0" y="1316.6" fill="#bbb" font-size="16" font-family="sans-serif">ParticleBufferManager / AudioManager は Init の引数で持ち物を受け取る形になった(MouseCursor は ② に載せた)。</text>
<rect x="2320.9" y="1465.0" width="709.6" height="356.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="2346.9" y="1507.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="2346.9" y="1542.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. OptionManager と各マネージャーが相互に引き合っている</text>
<text x="2346.9" y="1562.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    WindowOption → MainEngine / AudioOption → AudioManager /</text>
<text x="2346.9" y="1582.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    InputOption → InputManager。Option 側から押し込むのをやめ、</text>
<text x="2346.9" y="1602.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    受け手が起動時と変更通知で読む形にすると片方向になる。</text>
<text x="2346.9" y="1642.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. 所有されている側が親を引いている箇所が残る</text>
<text x="2346.9" y="1662.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ParticleBufferManager は解消。GPUParticlePool → MainEngine(遅延解放)と</text>
<text x="2346.9" y="1682.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    MouseCursor → MainEngine(ウィンドウ)が残り。</text>
<text x="2346.9" y="1722.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. InputManager → MainEngine はモードとウィンドウ</text>
<text x="2346.9" y="1742.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    Init でウィンドウを受け取り、モードは切り替え時に知らせれば片方向になる。</text>
<text x="2346.9" y="1782.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">4. InputActionManager → MainEditor は編集関数の登録</text>
<text x="2346.9" y="1802.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    エディターを知らない形(登録口をエンジン側に置く)にしたい。</text>
</svg>