<text x="-270.0" y="1350.0" fill="#bbb" font-size="16" font-family="sans-serif">BaseScene の直引きは 9 個 → 2 個(ワールドの作成と EngineServices の写し)。</text>
<text x="-270.0" y="1370.8" fill="#bbb" font-size="16" font-family="sans-serif">ECS / CollisionWorld / ComponentMetaRegistry からエディターへの依存は無くなった。</text>
<text x="-270.0" y="1391.6" fill="#bbb" font-size="16" font-family="sans-serif">右端はアプリ側に残っている直引き。</text>
<rect x="2670.6" y="1540.0" width="732.8" height="416.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="2696.6" y="1582.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="2696.6" y="1617.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. アプリ側の直引きが残っている(右端)</text>
<text x="2696.6" y="1637.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    Sequence 群 → SceneManager / GameManager、ScoreSystem → GameManager、</text>
<text x="2696.6" y="1657.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    CameraStartSystem → OptionManager。</text>
<text x="2696.6" y="1677.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    SystemContext / ObjectContext に経路があるので、そちらへ寄せる。</text>
<text x="2696.6" y="1717.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. コンポーネントのヘルパーがヘッダーで Instance() を呼んでいる</text>
<text x="2696.6" y="1737.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ModelComponent / ParticlesComponent は解消。</text>
<text x="2696.6" y="1757.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    SoundComponent / HitSoundComponent → AudioManager、</text>
<text x="2696.6" y="1777.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    FollowTargetComponent / AttachmentSlotsComponent → SceneManager が残り。</text>
<text x="2696.6" y="1817.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. Prefab → SceneManager</text>
<text x="2696.6" y="1837.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    生成先のワールドを SceneManager::RefWorld() で決めている。</text>
<text x="2696.6" y="1857.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    引数で World を受け取れば片付く。</text>
<text x="2696.6" y="1897.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">4. EngineServices に SceneManager が無い</text>
<text x="2696.6" y="1917.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    アプリ側の SceneManager 直引きが消えない理由がここ。</text>
<text x="2696.6" y="1937.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    載せるか、シーン遷移だけの細いインターフェースを足すか決めたい。</text>
</svg>