<text x="-270.0" y="1200.0" fill="#bbb" font-size="16" font-family="sans-serif">SceneViewPanel と EffectEditor がいちばん多くのシングルトンを直接引いている。</text>
<rect x="2811.2" y="1350.0" width="746.2" height="416.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="2837.2" y="1392.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="2837.2" y="1427.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. EditorContext があるのに使い切れていない</text>
<text x="2837.2" y="1447.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    PanelManager が EditorContext を持っているのに、パネルは各自 Instance()。</text>
<text x="2837.2" y="1467.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    よく使うもの(MainEngine / SceneManager / ResourceManager / AssetDatabase)</text>
<text x="2837.2" y="1487.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    を載せれば、パネル側は Context だけ見ればよくなる。</text>
<text x="2837.2" y="1527.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. SceneViewPanel(7個) と EffectEditor(7個) が突出している</text>
<text x="2837.2" y="1547.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    EffectEditor は専用ワールドを持つほぼミニアプリ。</text>
<text x="2837.2" y="1567.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    パネルではなく別レイヤーとして切り出したほうが見通しがよい。</text>
<text x="2837.2" y="1607.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. エンジン側からエディターへの逆向き依存</text>
<text x="2837.2" y="1627.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    AssetDatabase / Archive / PipelineState / World / ComponentMetaRegistry /</text>
<text x="2837.2" y="1647.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    CollisionWorld / BVHTraverser が MainEditor を直引き。</text>
<text x="2837.2" y="1667.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    用途はログ・計測・デバッグ描画なので、そこだけ細いインターフェースを</text>
<text x="2837.2" y="1687.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    切って挟めば、エンジンがエディターを知らなくて済む。</text>
<text x="2837.2" y="1727.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">4. エディター自身の直引きは許容範囲</text>
<text x="2837.2" y="1747.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    アプリ寿命のツール層なので、上の逆向き依存だけ直せば十分。</text>
</svg>