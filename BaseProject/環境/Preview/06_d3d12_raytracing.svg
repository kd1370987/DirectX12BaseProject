<text x="-270.0" y="1485.0" fill="#bbb" font-size="16" font-family="sans-serif">D3D12Wrapper(68 回)と DescriptorHeapManager::Instance()(62 回)は 0 回に。相互参照も消えた。</text>
<text x="-270.0" y="1505.8" fill="#bbb" font-size="16" font-family="sans-serif">レイトレ側で残る緑矢印は RayEngine 本体と、BLAS の遅延解放だけ。</text>
<rect x="1682.0" y="1655.0" width="777.4" height="276.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="1708.0" y="1697.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="1708.0" y="1732.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. 循環と D3D12Wrapper は解消済み</text>
<text x="1708.0" y="1752.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    GraphicsDevice / CommandContext / FrameManager / BackBuffer に分けて</text>
<text x="1708.0" y="1772.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    GraphicsEngine へ集約した。D3D12 層は Device* / HeapManager* を引数で受け取る。</text>
<text x="1708.0" y="1812.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. RayEngine は描画層の外に置かれたシングルトンのまま</text>
<text x="1708.0" y="1832.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    持ち主が居ないので MainEngine と RenderGraph が Instance() で引く。</text>
<text x="1708.0" y="1852.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    GraphicsEngine の持ち物にすると ② と同じ所有ツリーに収まる。</text>
<text x="1708.0" y="1892.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. BLAS → MainEngine は GraphicsEngine と遅延解放が欲しいだけ</text>
<text x="1708.0" y="1912.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    生成時の ResourceBuildContext から取れば依存が消える。</text>
</svg>