<text x="-270.0" y="1230.0" fill="#bbb" font-size="16" font-family="sans-serif">GPU リソース側(GPUResource / Texture / Buffer)は、</text>
<text x="-270.0" y="1250.8" fill="#bbb" font-size="16" font-family="sans-serif">ディスクリプタを取るために DescriptorHeapManager を直接引いている。</text>
<rect x="2300.8" y="1400.0" width="684.2" height="336.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="2326.8" y="1442.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="2326.8" y="1477.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. D3D12Wrapper ⇄ DescriptorHeapManager の相互参照</text>
<text x="2326.8" y="1497.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    DescriptorHeapManager が欲しいのは Device だけ。</text>
<text x="2326.8" y="1517.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    初期化時に受け取って保持すれば片方向になる。</text>
<text x="2326.8" y="1557.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. GPU リソースがディスクリプタ確保のため直引きしている</text>
<text x="2326.8" y="1577.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    GPUResource / Texture / Buffer 群 → DescriptorHeapManager。</text>
<text x="2326.8" y="1597.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    生成時にアロケーターの参照を渡す(ResourceBuildContext と同じ考え方)。</text>
<text x="2326.8" y="1637.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. BLAS → MainEngine は遅延解放の登録だけ</text>
<text x="2326.8" y="1657.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    「解放を後回しにする」インターフェースを切って渡せば依存が消える。</text>
<text x="2326.8" y="1697.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">4. PipelineState → MainEditor はログ</text>
<text x="2326.8" y="1717.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    シェーダー再コンパイルの結果表示。ログ経路を分ければよい。</text>
</svg>