<text x="-270.0" y="1305.0" fill="#bbb" font-size="16" font-family="sans-serif">シングルトンは 13 個 → 10 個。Instance() の呼び出しは 629 回 / 142 ファイル → 205 回 / 62 ファイル。</text>
<text x="-270.0" y="1325.8" fill="#bbb" font-size="16" font-family="sans-serif">GraphicsEngine の持ち物は ② と ⑥、EngineServices が配る先は ③ に載せた。</text>
<rect x="1832.0" y="1475.0" width="839.6" height="416.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="1858.0" y="1517.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="1858.0" y="1552.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. MainEngine が新しい「置き場」になりつつある</text>
<text x="1858.0" y="1572.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    Instance() の総数は 629 → 205 に減ったが、MainEngine だけは 62 → 64 回。</text>
<text x="1858.0" y="1592.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    D3D12Wrapper / DescriptorHeapManager を引いていた箇所の一部が</text>
<text x="1858.0" y="1612.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    MainEngine::Instance().RefGraphicsEngine() に付け替わっただけのものがある</text>
<text x="1858.0" y="1632.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    (BLAS / Mesh / ScopedResourceBuild / ImGuiContext / EditorHelper / SceneViewPanel)。</text>
<text x="1858.0" y="1672.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. OptionManager ⇄ MainEngine / InputManager / AudioManager は相互のまま</text>
<text x="1858.0" y="1692.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    D3D12Wrapper ⇄ DescriptorHeapManager の循環は消えた。</text>
<text x="1858.0" y="1712.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    残る循環はオプションの押し込み。受け手が起動時と変更通知で読む形にしたい。</text>
<text x="1858.0" y="1752.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. 描画層 → シーン / ゲームの逆流が残っている</text>
<text x="1858.0" y="1772.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    GraphicsEngine → GameManager::Draw()(テスト呼び出し)と</text>
<text x="1858.0" y="1792.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    GraphicsEngine → SceneManager::RefWorld()(BLAS 初期化キュー)。</text>
<text x="1858.0" y="1832.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">4. MainEngine に使われていないメンバーがある</text>
<text x="1858.0" y="1852.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    RenderContext の配列は GraphicsEngine へ移ったが、</text>
<text x="1858.0" y="1872.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    MainEngine.h 側の m_upRenderContextVec が宣言だけ残っている。</text>
</svg>