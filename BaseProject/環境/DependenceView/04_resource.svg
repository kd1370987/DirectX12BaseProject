<text x="4079.4" y="1317.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. 方針(ResourceBuildContext 経由)は徹底できた</text>
<text x="4079.4" y="1337.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    IO 群・Sound・Prefab の緑矢印は消えた。</text>
<text x="4079.4" y="1357.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ResourceManager::Instance() が残るのは ResourceRef&lt;T> の中だけ。</text>
<text x="4079.4" y="1397.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. GraphicsEngine が欲しくて MainEngine を引いている</text>
<text x="4079.4" y="1417.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ScopedResourceBuild はバッチを開くため、Mesh::Release は</text>
<text x="4079.4" y="1437.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    MeshBufferAllocator へ返すため(Release には Context が来ない)。</text>
</svg>