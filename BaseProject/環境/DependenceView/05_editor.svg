<text x="-270.0" y="1350.0" fill="#bbb" font-size="16" font-family="sans-serif">MainEditor::Instance() は 0。パネルからの SceneManager / OptionManager / AudioManager の直引きも 0 になり、</text>
<text x="-270.0" y="1370.8" fill="#bbb" font-size="16" font-family="sans-serif">EditorContext.pServices と pEffectEditor / pEditorCamera から引く。</text>
<text x="-270.0" y="1391.6" fill="#bbb" font-size="16" font-family="sans-serif">残る直引きは MainEngine だけ(SceneViewPanel / ProfilerPanel / EffectEditor が各 5 回)。</text>
<rect x="2588.0" y="1540.0" width="789.4" height="216.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="2614.0" y="1582.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="2614.0" y="1617.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. エンジン・アプリ → エディターは IDevTool 越しだけ</text>
<text x="2614.0" y="1637.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    MainEngine / SceneManager / Application / GameManager / InputActionManager は</text>
<text x="2614.0" y="1657.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    IDevTool を見るだけで、MainEditor を名指ししない。</text>
<text x="2614.0" y="1697.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. パネルの MainEngine 直引きが残る</text>
<text x="2614.0" y="1717.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    SceneViewPanel / ProfilerPanel / EffectEditor が各 5 回、ImGuiContext が 4 回。</text>
<text x="2614.0" y="1737.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    欲しいのは GraphicsEngine とモードなので、EditorContext に載せれば消せる。</text>
</svg>