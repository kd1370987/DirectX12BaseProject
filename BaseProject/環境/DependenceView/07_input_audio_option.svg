<text x="-270.0" y="1275.0" fill="#bbb" font-size="16" font-family="sans-serif">Option から各マネージャーを Instance() で押し込む形は消えた。WindowOption / AudioOption / InputOption は DrawEdit の EngineServices から、</text>
<text x="-270.0" y="1295.8" fill="#bbb" font-size="16" font-family="sans-serif">起動時の値は MainEngine が Init の引数(InputOption)・Apply(AudioOption)・毎フレームの流し込み(DebugDrawOption)で渡す。</text>
<text x="-270.0" y="1316.6" fill="#bbb" font-size="16" font-family="sans-serif">NativeWindow は入力を知らず、MainEngine がつないだフォーカスの通知先を呼ぶだけ。</text>
<rect x="2333.8" y="1465.0" width="711.2" height="256.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="2359.8" y="1507.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="2359.8" y="1542.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. InputManager → MainEngine はモードとウィンドウ</text>
<text x="2359.8" y="1562.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    Init でウィンドウを受け取り、モードは切り替え時に知らせれば片方向になる。</text>
<text x="2359.8" y="1602.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. パーティクルの遅延解放が MainEngine を引いている</text>
<text x="2359.8" y="1622.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ParticleBufferManager / GPUParticlePool / EmitterSlotPool。</text>
<text x="2359.8" y="1642.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    解放の口を Init で受け取れば依存が消える。</text>
<text x="2359.8" y="1682.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. InputActionManager → MainEngine は編集関数の登録</text>
<text x="2359.8" y="1702.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    RefDevTool() を引くためだけなので、Init で IDevTool を受け取れば消える。</text>
</svg>