<text x="-270.0" y="1350.0" fill="#bbb" font-size="16" font-family="sans-serif">シングルトンは 13 個(2026-09-10)→ 10 個(09-15)→ 2 個(10-09)。</text>
<text x="-270.0" y="1370.8" fill="#bbb" font-size="16" font-family="sans-serif">Instance() の呼び出しは 629 回 / 142 ファイル → 205 回 / 62 ファイル → 77 回 / 27 ファイル。</text>
<text x="-270.0" y="1391.6" fill="#bbb" font-size="16" font-family="sans-serif">GraphicsEngine の持ち物は ② と ⑥、EngineServices が配る先は ③ に載せた。</text>
<rect x="1401.0" y="1540.0" width="834.0" height="316.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="1427.0" y="1582.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="1427.0" y="1617.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. MainEngine::Instance() が 65 回残っている</text>
<text x="1427.0" y="1637.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    多いのは App.cpp(13)・InputManager(6)・エディター(29)。</text>
<text x="1427.0" y="1657.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    どれも EngineServices / EditorContext / PassContext に経路があるので、</text>
<text x="1427.0" y="1677.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    そちらへ寄せればさらに減らせる。</text>
<text x="1427.0" y="1717.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. シーンの解放順はアプリ側が持っている</text>
<text x="1427.0" y="1737.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    SceneManager の持ち主は MainEngine だが、Release はゲームより先に Application が呼ぶ。</text>
<text x="1427.0" y="1757.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    シーンのオブジェクトがゲームの記録(GameDataResource)を指しているため。</text>
<text x="1427.0" y="1797.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. ResourceManager::Instance() は残す判断</text>
<text x="1427.0" y="1817.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ResourceRef&lt;T> が値として資産に埋まり、コピー・破棄のたびに参照カウントを触る。</text>
<text x="1427.0" y="1837.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    引数で渡す口が無いので、ここだけは入口として残している。</text>
</svg>