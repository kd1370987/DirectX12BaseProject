<text x="-270.0" y="1470.0" fill="#bbb" font-size="16" font-family="sans-serif">シーン・ECS・GameObject・システムの Instance() は 0。アプリ側に残るのは入口の App.cpp と InputActionManager(RefDevTool)だけ。</text>
<text x="-270.0" y="1490.8" fill="#bbb" font-size="16" font-family="sans-serif">SceneManager / ObjectMetaRegistry を EngineServices に載せ、ゲームの記録はワールドの GameDataResource から引く形にした。</text>
<text x="-270.0" y="1511.6" fill="#bbb" font-size="16" font-family="sans-serif">右端はかつて直引きしていた使い手。今はすべてコンテキスト経由。</text>
<rect x="2570.6" y="1660.0" width="815.8" height="216.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="2596.6" y="1702.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="2596.6" y="1737.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. コンテキストへの寄せは完了</text>
<text x="2596.6" y="1757.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    Sequence 群は ObjectContext、ScoreSystem / CameraStartSystem は SystemContext、</text>
<text x="2596.6" y="1777.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    コンポーネントの編集 UI は CompEditContext から引く。</text>
<text x="2596.6" y="1817.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. World のリソースにアプリ寿命の記録の入口がある</text>
<text x="2596.6" y="1837.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    GameDataResource はワールド寿命の箱に、GameManager が持つ記録のポインタを入れている。</text>
<text x="2596.6" y="1857.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ワールドを作る作り手(GameManager)が詰めるので、作り手を通らないワールドには無い。</text>
</svg>