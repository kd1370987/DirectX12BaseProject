<text x="-270.0" y="1290.0" fill="#bbb" font-size="16" font-family="sans-serif">シングルトンは 13 個。実体を持つのは MainEngine / SceneManager / GameManager で、</text>
<text x="-270.0" y="1310.8" fill="#bbb" font-size="16" font-family="sans-serif">残りは「どこからでも引ける置き場」として使われている。</text>
<rect x="1689.0" y="1460.0" width="666.0" height="416.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="1715.0" y="1502.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="1715.0" y="1537.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. シングルトンが13個。実体を持っているのは3つだけ</text>
<text x="1715.0" y="1557.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    MainEngine / SceneManager / GameManager 以外の10個は</text>
<text x="1715.0" y="1577.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    「どこからでも引ける置き場」になっていて、依存の向きが追えない。</text>
<text x="1715.0" y="1597.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    MainEngine が起動時に組み立てて配れば緑矢印はかなり減らせる。</text>
<text x="1715.0" y="1637.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. 相互に引き合っている組がある</text>
<text x="1715.0" y="1657.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    D3D12Wrapper ⇄ DescriptorHeapManager</text>
<text x="1715.0" y="1677.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    OptionManager ⇄ MainEngine / InputManager / AudioManager</text>
<text x="1715.0" y="1697.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    初期化順と解放順が暗黙の了解になっている。片方向に倒したい。</text>
<text x="1715.0" y="1737.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. BaseScene が9個のシングルトンを直接引いている</text>
<text x="1715.0" y="1757.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    EngineServices を組み立てているのは BaseScene 自身なので、</text>
<text x="1715.0" y="1777.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    作ったあとは自分もそこ経由で引けば直引きを消せる。</text>
<text x="1715.0" y="1817.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">4. Application が MainEditor を15箇所で叩いている</text>
<text x="1715.0" y="1837.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    中身はプロファイラのタイマー。スコープガード(RAII)かマクロに包めば、</text>
<text x="1715.0" y="1857.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    アプリの入口からエディター依存が消える。</text>
</svg>