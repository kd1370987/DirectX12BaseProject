<text x="-270.0" y="1020.0" fill="#bbb" font-size="16" font-family="sans-serif">入力は必ず InputManager 経由。アプリ側の割り当ては UserData に入り、</text>
<text x="-270.0" y="1040.8" fill="#bbb" font-size="16" font-family="sans-serif">InputActionManager が InputManager へ流し込む。</text>
<rect x="2373.0" y="1190.0" width="702.0" height="396.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="2399.0" y="1232.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="2399.0" y="1267.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. OptionManager と各マネージャーが相互に引き合っている</text>
<text x="2399.0" y="1287.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    WindowOption → MainEngine / AudioOption → AudioManager /</text>
<text x="2399.0" y="1307.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    InputOption → InputManager。Option 側から押し込むのをやめ、</text>
<text x="2399.0" y="1327.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    受け手が起動時と変更通知で読む形にすると片方向になる。</text>
<text x="2399.0" y="1367.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. 所有されている側が Instance() で親を引いている</text>
<text x="2399.0" y="1387.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ParticleBufferManager / GPUParticlePool / MouseCursor → MainEngine。</text>
<text x="2399.0" y="1407.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    所有者が初期化時に必要なものを渡せばよい。</text>
<text x="2399.0" y="1447.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. InputActionManager → MainEditor はモード判定</text>
<text x="2399.0" y="1467.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    アプリのモードを持っているのは MainEngine。</text>
<text x="2399.0" y="1487.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    そちらから取ればゲーム側がエディターを見なくて済む。</text>
<text x="2399.0" y="1527.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">4. GameManager がゲーム側の各所から引かれている</text>
<text x="2399.0" y="1547.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    Sequence / ScoreHUD / ScoreSystem に加えて GraphicsEngine からも。</text>
<text x="2399.0" y="1567.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    描画層からゲーム層への逆流は特に切り離したい。</text>
</svg>