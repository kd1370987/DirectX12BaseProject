<text x="-270.0" y="1350.0" fill="#bbb" font-size="16" font-family="sans-serif">EngineServices はシングルトンの実体を集めて配る箱。</text>
<text x="-270.0" y="1370.8" fill="#bbb" font-size="16" font-family="sans-serif">System / GameObject はここから引くので、自分では Instance() を呼ばない。</text>
<rect x="2109.4" y="1520.0" width="725.6" height="496.0" rx="10" fill="#1a1410" stroke="#ff922b" stroke-width="2"/>
<text x="2135.4" y="1562.0" fill="#ff922b" font-size="23" font-family="sans-serif">改善点</text>
<text x="2135.4" y="1597.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">1. 経路は用意できているが、使い切れていない</text>
<text x="2135.4" y="1617.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    EngineServices / SystemContext / ObjectContext の3経路は機能している。</text>
<text x="2135.4" y="1637.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ただしアプリ側にはまだ直引きが残っている(この図には未掲載):</text>
<text x="2135.4" y="1657.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    GunShootSystem → ResourceManager / ScoreSystem → GameManager /</text>
<text x="2135.4" y="1677.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    CameraStartSystem → OptionManager / 各 Sequence → SceneManager</text>
<text x="2135.4" y="1717.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">2. コンポーネントのヘルパーがヘッダーで Instance() を呼んでいる</text>
<text x="2135.4" y="1737.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ModelComponent / ParticlesComponent / SoundComponent など。</text>
<text x="2135.4" y="1757.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    コンポーネントは POD なので、取得と返却はシステム側か</text>
<text x="2135.4" y="1777.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ComponentTraits::Release 経由に寄せたい。</text>
<text x="2135.4" y="1817.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">3. BaseScene だけが例外で9個を直引き</text>
<text x="2135.4" y="1837.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    EngineServices を作る当人なので、作ったあとは自分も経由する。</text>
<text x="2135.4" y="1877.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">4. ECS がエディターを見ている</text>
<text x="2135.4" y="1897.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    World.h / ComponentMetaRegistry → MainEditor はログ目的。</text>
<text x="2135.4" y="1917.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    ログ用の細いインターフェースを挟めば ECS からエディターが消える。</text>
<text x="2135.4" y="1957.0" fill="#ff922b" font-size="15" font-family="sans-serif" xml:space="preserve">5. Prefab / CollisionWorld の直引き</text>
<text x="2135.4" y="1977.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    Prefab は生成に SceneManager、CollisionWorld は ResourceManager が要る。</text>
<text x="2135.4" y="1997.0" fill="#e6e6e6" font-size="15" font-family="sans-serif" xml:space="preserve">    どちらも引数で World / Context を受け取れば片付く。</text>
</svg>